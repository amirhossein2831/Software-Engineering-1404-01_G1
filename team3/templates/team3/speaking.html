{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Speaking Exam</title>
    <link rel="stylesheet" href="{% static 'team3/styles/index.css' %}">
    <link rel="stylesheet" href="{% static 'team3/styles/speaking.css' %}">
</head>
<body>

<div class="exam-wrapper">

    <!-- Header -->
    <div class="exam-header">
        <div class="user-info">
            <div class="user-avatar" aria-hidden="true">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="10" r="5" fill="#647eb4"/>
                    <path d="M5 25C5 20 9 17 15 17C21 17 25 20 25 25" stroke="#647eb4" stroke-width="2"
                          fill="none"/>
                </svg>
            </div>
            <span class="username">name</span>
            <span class="timer">59:02</span>
        </div>

        <div class="exam-title">
            <div>exam number 1</div>
            <div class="subtitle">speaking</div>
        </div>

        <div class="exam-actions">
            <button class="btn-outline">توقف / ادامه</button>
            <button class="btn-primary">خروج</button>
        </div>
    </div>

    <div class="exam-body" style="background-color: white;border-radius: 40px;padding: 30px 20px;margin-top: 20px">

        <!-- Question cards -->
        <div class="question-card">
            <h3>Question 1</h3>
            <p class="question-text">how are you today?</p>

            <div class="voice-actions">
                <button class="voice-btn" type="button">record voice</button>

                <!-- Upload: button + hidden input -->
                <button class="voice-btn" type="button" onclick="document.getElementById('upload-q1').click()">
                    upload voice
                </button>
                <input id="upload-q1" class="voice-input" type="file" accept="audio/*" />
            </div>
        </div>

        <div class="question-card">
            <h3>Question 2</h3>
            <p class="question-text">tell me about your daily routine</p>

            <div class="voice-actions">
                <button class="voice-btn" type="button">record voice</button>

                <button class="voice-btn" type="button" onclick="document.getElementById('upload-q2').click()">
                    upload voice
                </button>
                <input id="upload-q2" class="voice-input" type="file" accept="audio/*" />
            </div>
        </div>

        <div class="question-card">
            <h3>Question 3</h3>
            <p class="question-text">do you prefer city life or countryside?</p>

            <div class="voice-actions">
                <button class="voice-btn" type="button">record voice</button>

                <button class="voice-btn" type="button" onclick="document.getElementById('upload-q3').click()">
                    upload voice
                </button>
                <input id="upload-q3" class="voice-input" type="file" accept="audio/*" />
            </div>
        </div>

        <!-- Finish Button -->
        <div class="finish-wrapper">
            <button class="finish-btn">Finish</button>
        </div>

    </div>

</div>

</body>
</html>
