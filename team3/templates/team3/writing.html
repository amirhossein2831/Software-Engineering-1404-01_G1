{% load static %}
{% load dict_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Writing Exam</title>
    <link rel="stylesheet" href="{% static 'team3/styles/index.css' %}">
    <link rel="stylesheet" href="{% static 'team3/styles/writing.css' %}">
</head>
<body>
<div class="exam-wrapper">

    <div class="exam-header">
        <div class="user-info">
            <div class="user-avatar" aria-hidden="true">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="10" r="5" fill="#647eb4"/>
                    <path d="M5 25C5 20 9 17 15 17C21 17 25 20 25 25" stroke="#647eb4" stroke-width="2"
                          fill="none"/>
                </svg>
            </div>
            <span class="username">{{ request.user.first_name }} {{ request.user.last_name }}</span>
            <span class="timer" id="timer">--:--</span>
        </div>

        <div class="exam-title">
            <div>{{ pack.title|default:"Writing Exam" }}</div>
            <div class="subtitle">{{ exam.get_section_display }}</div>
        </div>

        <div class="exam-actions">
            <button class="btn-outline" id="pauseBtn">Pause</button>
            <button class="btn-primary" id="exitBtn">Exit</button>
        </div>
    </div>

    <div style="background-color: white;border-radius: 40px;padding: 30px 20px;margin-top: 20px">
        {% for q in questions %}
        <div class="question-card">
            <h3>Question {{ q.number }}</h3>
            <p class="question-text">{{ q.description }}</p>

            <textarea class="answer-box answer"
                      data-qnum="{{ q.number }}"
                      placeholder="Type your answer here...">{{ answers_map|get_item:q.number }}</textarea>
        </div>
        {% endfor %}

        <div class="finish-wrapper">
            <button class="finish-btn" id="submitBtn">Finish</button>
        </div>
    </div>

</div>
<script>
    let remaining = Number("{{ remaining_seconds|default:'0' }}");
    let paused = false;

    const urls = {
        pause: "{% url 'writing_pause' user_exam.id %}",
        resume: "{% url 'writing_resume' user_exam.id %}",
        autosave: "{% url 'writing_autosave' user_exam.id %}",
        submit: "{% url 'writing_submit' user_exam.id %}",
        exit: "{% url 'writing_exit' user_exam.id %}",
    };

    const timerEl = document.getElementById("timer");
    const pauseBtn = document.getElementById("pauseBtn");
    const submitBtn = document.getElementById("submitBtn");
    const exitBtn = document.getElementById("exitBtn");

    function fmt(sec) {
        sec = Math.max(0, sec);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function tick() {
        if (!paused) {
            remaining -= 1;
            if (remaining <= 0) {
                remaining = 0;
                paused = true;
                submitExam(); // auto submit
            }
        }
        timerEl.textContent = fmt(remaining);
    }

    timerEl.textContent = fmt(remaining);
    setInterval(tick, 1000);

    function getAnswersPayload() {
        const answers = {};
        document.querySelectorAll(".answer").forEach(t => {
            // key by question number
            answers[t.dataset.qnum] = t.value;
        });
        return answers;
    }

    // cursor to end on focus
    document.querySelectorAll(".answer").forEach(t => {
        t.addEventListener("focus", () => {
            const len = t.value.length;
            t.setSelectionRange(len, len);
        });
    });

    function getCookie(name) {
        const cookies = document.cookie ? document.cookie.split("; ") : [];
        for (const c of cookies) {
            const [k, ...v] = c.split("=");
            if (k === name) return decodeURIComponent(v.join("="));
        }
        return null;
    }

    async function postJSON(url, data) {
        const csrftoken = getCookie("csrftoken");

        const res = await fetch(url, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrftoken || "",
                "X-Requested-With": "XMLHttpRequest",
            },
            body: data ? JSON.stringify(data) : "{}",
        });

        const contentType = res.headers.get("content-type") || "";
        const text = await res.text();

        if (!res.ok) {
            console.error("POST failed:", url, res.status, text.slice(0, 400));
            alert(`Request failed: ${res.status} (see console)`);
            return { ok: false };
        }

        if (!contentType.includes("application/json")) {
            console.error("Expected JSON but got:", contentType, text.slice(0, 400));
            alert("Not JSON response (see console).");
            return { ok: false };
        }

        return JSON.parse(text);
    }

    async function autosave() {
        if (paused) return;

        const data = await postJSON(urls.autosave, { answers: getAnswersPayload() });
        if (data.ok && typeof data.remaining_seconds === "number") {
            remaining = data.remaining_seconds;
            timerEl.textContent = fmt(remaining);
        }
    }

    // autosave every 10 seconds
    setInterval(autosave, 10000);

    // autosave on typing (debounced)
    let typingTimer = null;
    document.querySelectorAll(".answer").forEach(t => {
        t.addEventListener("input", () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(autosave, 800);
        });
    });

    pauseBtn.addEventListener("click", async () => {
        if (!paused) {
            const data = await postJSON(urls.pause);
            if (data.ok) {
                paused = true;
                pauseBtn.textContent = "Resume";
                remaining = data.remaining_seconds ?? remaining;
                timerEl.textContent = fmt(remaining);
            }
        } else {
            const data = await postJSON(urls.resume);
            if (data.ok) {
                paused = false;
                pauseBtn.textContent = "Pause";
                remaining = data.remaining_seconds ?? remaining;
                timerEl.textContent = fmt(remaining);
            }
        }
    });

    async function submitExam() {
        await autosave();
        const data = await postJSON(urls.submit);
        if (data.ok) {
            window.location.href = "/team3/feedbacks/"; // adjust to your feedback list
        }
    }

    submitBtn.addEventListener("click", submitExam);

    exitBtn.addEventListener("click", async () => {
        await autosave();
        const data = await postJSON(urls.exit);
        if (data.ok) {
            window.location.href = data.redirect || "/team3/exams/";
        }
    });
</script>

</body>
</html>
